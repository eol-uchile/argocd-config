---
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: emi-listeners
  namespace: emi-project
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production-gateway
spec:
  parentRef:
    name: public-gateway
    namespace: tigera-gateway
    kind: Gateway
  listeners:
    - name: emi-uchile-cl-https
      protocol: HTTPS
      port: 443
      hostname: "emi.uchile.cl"
      allowedRoutes:
        namespaces:
          from: Same  # solo acepta rutas locales de este namespace
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: emi-project-ingress-certificate
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: emi-uchile-cl-https-route
  namespace: emi-project
spec:
  hostnames:
  - emi.uchile.cl
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: emi-listeners
      namespace: emi-project
      sectionName: emi-uchile-cl-https
  rules:
    - backendRefs:
        - name: emi-wordpress-svc
          namespace: emi-project
          port: 80
      matches:
        - path:
            type: PathPrefix
            value: /
