---
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: test-listeners
  namespace: test-eol
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production-gateway
spec:
  parentRef:
    name: public-gateway
    namespace: tigera-gateway
    kind: Gateway
  listeners:
    - name: test-eol-uchile-cl-https
      protocol: HTTPS
      port: 443
      hostname: "test.eol.uchile.cl"
      allowedRoutes:
        namespaces:
          from: Same  # solo acepta rutas locales de este namespace
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: test-host-tls-secret
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: test-eol-uchile-cl-https-route
  namespace: test-eol
spec:
  hostnames:
    - test.eol.uchile.cl
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: test-listeners
      namespace: test-eol
      sectionName: test-eol-uchile-cl-https
  rules:
    - backendRefs:
        - name: test-host-svc
          namespace: test-eol
          port: 80
      matches:
        - path:
            type: PathPrefix
            value: /
